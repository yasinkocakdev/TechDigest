# Paket ve GitHub Actions güncellemelerini haftalık PR olarak önerir (SHA sabitlemeleri dahil).
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    # Büyük sürümler (MailKit 5, .NET 11 paketleri) API kırabilir: elle, bilinçli yükseltilir.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
