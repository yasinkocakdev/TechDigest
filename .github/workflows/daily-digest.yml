name: Daily TechDigest
run-name: ${{ inputs.dry_run && 'Dry run' || 'Send digest' }}

on:
  # Main trigger: cron-job.org calls the GitHub API (workflow_dispatch) every day at 07:00 Istanbul.
  # GitHub's own scheduler was delaying runs by 8-10 hours, so it is only a backup now.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build the digest but don't send email"
        type: boolean
        default: false
  schedule:
    # Backup: 05:00 UTC = 08:00 Istanbul (usually starts later). Skips itself if
    # today's digest was already sent.
    - cron: "0 5 * * *"

permissions:
  contents: read
  actions: read # needed to check whether today's digest was already sent

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip if already sent today
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start=$(date -u -d "@$(TZ=Europe/Istanbul date -d 'today 00:00' +%s)" +%Y-%m-%dT%H:%M:%SZ)
          sent=$(gh run list -R "$GITHUB_REPOSITORY" --workflow daily-digest.yml --status success -L 30 \
            --json displayTitle,createdAt \
            --jq "[.[] | select(.displayTitle == \"Send digest\" and .createdAt >= \"$start\")] | length")
          if [ "$sent" -gt 0 ]; then
            echo "Today's digest was already sent (since $start). Skipping backup run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-dotnet@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          dotnet-version: "8.0.x"

      - name: Test
        if: steps.guard.outputs.skip != 'true'
        run: dotnet test --verbosity minimal

      - name: Build and send digest
        if: steps.guard.outputs.skip != 'true'
        run: dotnet run -c Release --project src/TechDigest -- ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_ADDRESS: ${{ secrets.TO_ADDRESS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
