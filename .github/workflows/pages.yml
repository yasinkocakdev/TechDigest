name: Publish site

# site/ (main) + archive dalındaki veriler → GitHub Pages.
# Günlük bültenden sonra (daily-digest.yml çağırır) ve site kodu değişince çalışır.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: site

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: archive
          path: archive
          persist-credentials: false

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp -r archive/days _site/data/ 2>/dev/null || mkdir -p _site/data/days
          if [ -f archive/index.json ]; then cp archive/index.json _site/data/; else echo '{"version":1,"days":[]}' > _site/data/index.json; fi
          echo "$(ls _site/data/days | wc -l) day(s) in archive"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
