<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TechDigest — Daily AI, chips &amp; software news</title>
  <meta name="description" content="A daily, curated briefing on AI, chips, markets, software and security — with Turkish summaries and IELTS vocabulary.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)">
  <!-- Sadece kendi dosyalarımız + Google Fonts. Satır içi script yok; veri DOM'a sadece textContent ile yazılır. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta property="og:title" content="TechDigest">
  <meta property="og:description" content="Daily AI, chips, markets & software news — curated by coverage, summarised in Turkish.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#/" aria-label="TechDigest — today">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name">Tech<b>Digest</b></span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a class="nav__link" href="#/" data-nav="day">Today</a>
        <a class="nav__link" href="#/archive" data-nav="archive">Archive</a>
        <a class="nav__link" href="#/words" data-nav="words">Words</a>
      </nav>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="page" tabindex="-1" aria-live="polite">
    <div class="skeleton" aria-hidden="true">
      <div class="sk sk--title"></div><div class="sk sk--line"></div>
      <div class="sk sk--card"></div><div class="sk-grid"><div class="sk sk--card"></div><div class="sk sk--card"></div></div>
    </div>
  </main>

  <footer class="footer">
    <p>Curated every morning at 07:00 Istanbul time from 14 feeds · Built with C# &amp; .NET by Yasin ·
      <a href="https://github.com/yasinkocakdev/TechDigest" rel="noopener">Source on GitHub</a></p>
  </footer>

  <noscript><p class="noscript">TechDigest needs JavaScript to load the daily briefings.</p></noscript>
</body>
</html>
